# Slicer sidecar -- our own FastAPI wrapper (./slicer) around the Bambu Studio
# CLI. Profile `slicer`: `docker compose --profile slicer up -d` (or set
# `COMPOSE_PROFILES=slicer` in `.env`, same convention as the printer/beat
# profiles -- see `.env.example`). Set TDMM_SLICER_URL=http://slicer:3001 to
# switch the integration on.
#
# `app.services.slicer_client.SlicerClient` talks to it. The release workflow
# publishes `ghcr.io/<owner>/tdmm-slicer:<bambu-version>-<sha>`; set
# SLICER_TAG to that to use the published image instead of building locally.
# The Bambu Studio AppImage is pinned (version + sha256) in slicer/Dockerfile.
services:
  slicer:
    build: ./slicer
    image: tdmm-slicer:${SLICER_TAG:-local}
    platform: linux/amd64
    profiles: [slicer]
    expose:
      - "3001"
    environment:
      SLICER_MAX_JOBS: ${SLICER_MAX_JOBS:-1}
      SLICER_JOB_TIMEOUT_S: ${SLICER_JOB_TIMEOUT_S:-600}
      SLICER_USE_XVFB: ${SLICER_USE_XVFB:-0}
    mem_limit: ${SLICER_MEM_LIMIT:-4g}
    read_only: true
    tmpfs:
      - /tmp:size=${SLICER_TMP_SIZE:-1g}
      - /home/slicer:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:3001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
