# Slicer sidecar -- our own FastAPI wrapper (./slicer) around the Bambu Studio
# CLI. Always on (no profile); Settings -> Server enables/disables the
# integration and sets its URL (default http://slicer:3001).
#
# `app.services.slicer_client.SlicerClient` talks to it. The release workflow
# publishes ghcr.io/metril/3d-model-manager-slicer (:edge, :sha-<short>,
# :<bambu-version>-<sha>, and :X.Y.Z/:X.Y/:X/:latest on releases);
# compose.prod.yaml pulls it. Standalone, set SLICER_IMAGE to use a published
# tag instead of the local build. The Bambu Studio AppImage is pinned
# (version + sha256) in slicer/Dockerfile.
services:
  slicer:
    build: ./slicer
    image: ${SLICER_IMAGE:-tdmm-slicer:local}
    platform: linux/amd64
    expose:
      - "3001"
    environment:
      SLICER_MAX_JOBS: ${SLICER_MAX_JOBS:-1}
      SLICER_JOB_TIMEOUT_S: ${SLICER_JOB_TIMEOUT_S:-600}
      SLICER_USE_XVFB: ${SLICER_USE_XVFB:-0}
    mem_limit: ${SLICER_MEM_LIMIT:-4g}
    read_only: true
    tmpfs:
      - /tmp:size=${SLICER_TMP_SIZE:-1g}
      - /home/slicer:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:3001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
