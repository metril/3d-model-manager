# Slicer sidecar (P6 "slicer, profiles, recipes and dispatch" plan, Task 2)
# -- a pinned `ghcr.io/maziggy/bambu-studio-api` image fronting Bambu
# Studio's CLI slicer over HTTP. Profile `slicer`: `docker compose --profile
# slicer up -d` (or set `COMPOSE_PROFILES=slicer` in `.env`, same convention
# as the printer/beat profiles -- see `.env.example`).
#
# `app.services.slicer_client.SlicerClient` talks to it; the real endpoint
# shapes are UNVERIFIED (no live image was reachable while writing this --
# see that module's docstring), so nothing here depends on them beyond the
# healthcheck path.
#
# Tag pin: the image publishes no semver `latest` worth trusting (it moves)
# and no dated tags -- its GHCR tag list (`bambuddy-<version>`, inspected
# via the anonymous GHCR token endpoint since this isn't our registry) tops
# out, as of 2026-10-22, at `bambuddy-1.2.5.7` (there's also a
# `bambuddy-1.2.6b1`, but that's a beta of the NEXT minor, skipped in favor
# of the highest stable patch). Override with `SLICER_TAG` in `.env`
# without editing this file.
services:
  slicer:
    image: ghcr.io/maziggy/bambu-studio-api:${SLICER_TAG:-bambuddy-1.2.5.7}
    platform: linux/amd64
    profiles: [slicer]
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:3001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
