[project]
name = "tdmm-slicer"
version = "0.26.1"
description = "FastAPI wrapper around the OrcaSlicer CLI"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.166", "uvicorn[standard]==0.34.*", "python-multipart==0.0.34"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
