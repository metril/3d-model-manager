# OrcaSlicer GUI sidecar (docs/orcaslicer.md). Opt-in: COMPOSE_PROFILES=orcaslicer.
# Streams the real OrcaSlicer over Selkies/WebSocket; the api reverse-proxies
# /slicer/ behind our login. NEVER publish 3000/3001: the Selkies terminal has
# passwordless sudo, so only our login protects it. Nothing is published here.
#
# GPU: add -f compose.orcaslicer.dri.yaml (Intel/AMD dev host) or
# -f compose.orcaslicer.gpu.yaml (NVIDIA host). Without either, OrcaSlicer renders in
# software (slow).
services:
  orcaslicer:
    build: ./docker/orcaslicer
    image: ${ORCASLICER_IMAGE:-tdmm-orcaslicer:local}
    platform: linux/amd64
    profiles: [orcaslicer]
    expose:
      - "3000"
      - "3010"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      SUBFOLDER: /slicer/
      SELKIES_FRAME_ANCESTORS: ${ORCASLICER_FRAME_ANCESTORS:-'self'}
      ORCASLICER_LAUNCHER_TOKEN: ${TDMM_ORCASLICER_LAUNCHER_TOKEN:-}
      # Selkies' own upload/download file manager is off (we use /exchange).
      SELKIES_FILE_TRANSFERS: ""
      SELKIES_ALLOWED_ORIGINS: ${ORCASLICER_ALLOWED_ORIGINS:-}
    shm_size: 1gb
    mem_limit: ${ORCASLICER_MEM_LIMIT:-4g}
    volumes:
      - orcaslicer_config:/config
      - ${ORCASLICER_EXCHANGE_HOST_DIR:-./orcaslicer-exchange}:/exchange
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:3010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - orcaslicer_net
    restart: unless-stopped

volumes:
  orcaslicer_config:
