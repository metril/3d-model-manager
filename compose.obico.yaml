# Obico ML sidecar (Q10 failure detection). Always on (no profile); enable it
# and set its URL (http://obico-ml:3333) in Settings -> Server. CPU: the
# upstream image runs the darknet model on CPU; ~1-3 s per frame is fine at
# one frame per 10 s. The image is large; `docker compose stop obico-ml`
# reclaims it if unused.
#
# Obico publishes no ready-to-run ml_api image (only its base layers), so this
# builds upstream's ml_api directly from the obico-server repo, pinned to a
# commit. The release workflow builds the same context and publishes
# ghcr.io/metril/3d-model-manager-obico-ml (:edge, :sha-<short>,
# :upstream-<short>, and the version ladder on releases); compose.prod.yaml
# swaps that image in. The pin below is the single source of truth -- the
# workflow reads it from this file. printerd hands the ML API a one-shot snapshot URL
# served by the API (`/api/obico/frame/<nonce>`), so the sidecar must be able
# to reach `api:8000` (same compose network).
services:
  obico-ml:
    build:
      context: https://github.com/TheSpaghettiDetective/obico-server.git#6f938964c63892df2b6d5b68d99ea783fc1a7c78:ml_api
    image: ${OBICO_ML_IMAGE:-tdmm-obico-ml:local}
    platform: linux/amd64
    command: ["bash", "-c", "gunicorn --bind 0.0.0.0:3333 --workers 1 --timeout 120 wsgi"]
    environment:
      DEBUG: "False"
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:3333/hc/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
