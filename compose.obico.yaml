# Obico ML sidecar (Q10 failure detection). Profile `obico`:
# `docker compose -f compose.yaml -f compose.obico.yaml --profile obico up -d`
# (or COMPOSE_PROFILES=obico in `.env`). Then set TDMM_OBICO_URL=http://obico-ml:3333
# (or enter it in Settings -> Failure detection). CPU by default -- the stock
# image runs the darknet model on CPU; ~1-3 s per frame is fine at one frame
# per 10 s. printerd hands the ML API a one-shot snapshot URL served by the API
# (`/api/obico/frame/<nonce>`), so the sidecar must be able to reach `api:8000`
# (same compose network).
services:
  obico-ml:
    image: thespaghettidetective/ml_api:${OBICO_ML_TAG:-base_image}
    profiles: [obico]
    command: ["bash", "-c", "gunicorn --bind 0.0.0.0:3333 --workers 1 --timeout 120 wsgi"]
    environment:
      DEBUG: "False"
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:3333/hc/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
