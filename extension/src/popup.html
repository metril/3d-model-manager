<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to my library</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body class="popup">
    <main>
      <h1>Save to my library</h1>
      <p id="message">Loading&hellip;</p>
      <div id="save-options" class="stack" hidden>
        <div>
          <label for="collection">Collection</label>
          <select id="collection" aria-describedby="collection-hint">
            <option value="">None</option>
          </select>
          <p id="collection-hint" class="hint">Adds the model to one of your followed collections.</p>
        </div>
        <div>
          <label for="tag-input">Tags</label>
          <input id="tag-input" type="text" list="tag-list" autocomplete="off" aria-describedby="tag-hint" placeholder="Add a tag, press Enter" />
          <datalist id="tag-list"></datalist>
          <div id="tag-chips" class="chips"></div>
          <p id="tag-hint" class="hint">Up to 20 tags. Applied when the import finishes.</p>
        </div>
      </div>
      <div id="actions"></div>
      <div id="access"></div>
      <div id="progress" class="stack" hidden>
        <p id="import-status" class="status" role="status"></p>
        <a id="open-app" class="button" target="_blank" rel="noreferrer" hidden>Open in app</a>
        <div id="queue-box" class="stack" hidden>
          <label for="printer">Printer</label>
          <select id="printer"></select>
          <button id="queue-button" type="button">Add to queue</button>
        </div>
        <p id="queue-note" class="queue-note" role="status"></p>
      </div>
      <p id="status" class="status" role="status"></p>
      <p id="error" class="status error" role="alert"></p>
      <p id="courier" class="hint"></p>
      <p id="whoami" class="hint footer" hidden></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
