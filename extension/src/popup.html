<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save to my library</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        width: 280px;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1b1b1b;
        background: #fff;
      }
      main {
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: #555;
      }
      button,
      a.button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #f5f5f5;
        color: #1b1b1b;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      button.primary,
      a.button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      button.primary:disabled {
        background: #94a8d8;
        border-color: #94a8d8;
      }
      .status {
        margin: 12px 0 0;
        font-size: 13px;
        min-height: 1em;
      }
      .status.ok {
        color: #1a7f37;
      }
      .status.error {
        color: #c0342a;
      }
      .status.warn {
        color: #9a6700;
      }
      .hint {
        font-size: 12px;
        color: #777;
        margin: 8px 0 0;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e1e;
          color: #eee;
        }
        p {
          color: #aaa;
        }
        button,
        a.button {
          background: #2a2a2a;
          border-color: #444;
          color: #eee;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Save to my library</h1>
      <p id="message">Loading&hellip;</p>
      <div id="actions"></div>
      <div id="access"></div>
      <p id="status" class="status" role="status"></p>
      <p id="courier" class="hint"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
