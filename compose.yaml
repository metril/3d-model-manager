# api + worker-io + worker-cpu + printerd (one shared image, docker/Dockerfile)
# + db + redis (SPEC "Architecture").
#
# Worker split (SPEC "Architecture"; M2 Task 10): `worker-io` runs
# `store_to_backend` and everything else that isn't a pipeline step;
# `worker-cpu` runs the CPU-heavy extraction/convert/render pipeline steps
# (`app.tasks.pipeline.*`, routed there by `celery_app.py`'s `task_routes`)
# with a memory-recycled process pool -- OCCT (STEP/IGES) and f3d can leak
# or balloon memory per-task, so each cpu worker child is recycled after 16
# tasks OR 1.5 GiB RSS, whichever comes first.
#
# PUID/PGID (Task 9): unset by default (containers run as root, unchanged
# M1 behavior). Set both in `.env` to have the entrypoint drop api/worker
# to that host uid/gid instead, so files written under the bind-mounted
# `./library` aren't root-owned -- see docker/entrypoint.sh.
#
# `beat` and `printerd` are always-on services (Round 10 Task 3 retired
# their compose profiles): every feature they might run -- the scheduled
# scan/collection-sync/watched-folder dispatch, and the printer MQTT
# supervisor -- is now governed live by the DB-backed Settings (`PUT
# /settings/app`, "Settings" UI), not by which containers happen to be up.
# Flipping a setting off there is what makes each feature idle; `docker
# compose up` alone starts every service, on or off.
#
# `beat`: runs Celery beat, which ticks a single unconditional dispatcher
# (`app.tasks.scheduler.dispatch_scheduled`, Round 10 Task 2) every 15s;
# each tick re-reads Settings fresh and fires scan/sync/watch only for
# whichever of those has its own interval set to a positive number of
# seconds -- an edit via the Settings UI takes effect on the very next tick,
# no restart of `beat` (or anything else) required.
#
# `printerd` (M4): the Bambu LAN MQTT supervisor -- reads the printer flag
# live every reconcile tick (`app.printerd.PrinterDaemon.enabled_printers`,
# Round 10 Task 3) and tears down/starts every printer's worker accordingly;
# harmless with the flag off (zero workers) and needs no restart when it's
# flipped on via the Settings UI (see README "Printer integration").
#
# Watched-folder auto-import (Round 8 Task 5): `worker-io` always mounts
# `./slicer-watch` (override with `WATCH_HOST_DIR`) at `/watch`, but nothing
# polls it unless the watch dir is configured AND the watch interval
# (Settings UI) is a positive number of seconds -- see
# `app.tasks.scheduler.dispatch_scheduled`'s dispatch condition.
#
# Quickstart: `cp .env.example .env` then `docker compose up -d --build`.
# See README "Quickstart" for the first-run admin password note.

include:
  - compose.slicer.yaml

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    ports:
      - "8080:8080"
    environment:
      ROLE: api
      # Round 8: the api only REPORTS the watched folder's container path via
      # GET /features (Settings "Slicer integration" card) -- it never reads
      # the folder, so no /watch volume here. Must match worker-io/beat.
      WATCH_DIR: /watch
      TDMM_VP_ENABLED: ${TDMM_VP_ENABLED:-false}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker-io:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    environment:
      ROLE: worker
      QUEUES: io
      CONCURRENCY: 2
      # Round 8 Task 5: the container-side path the watched-folder task
      # (`app.tasks.slicer_watch`, routed to the `io` queue this worker
      # consumes) polls. Only fires ticks once `WATCH_INTERVAL`
      # is also set in `.env` AND the `beat` profile is running.
      WATCH_DIR: /watch
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
      - ${WATCH_HOST_DIR:-./slicer-watch}:/watch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 10 -d celery@$$HOSTNAME"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  worker-cpu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    environment:
      ROLE: worker
      QUEUES: cpu
      # No CONCURRENCY override here -- Celery defaults to one process
      # per CPU core, which is what CPU-bound extraction/convert/render work
      # wants. Recycled per-child (task count AND RSS) to contain OCCT/f3d
      # memory growth (SPEC "Architecture").
      MAX_TASKS_PER_CHILD: 16
      # KiB (1.5 GiB), passed straight to Celery's --max-memory-per-child.
      MAX_MEMORY_PER_CHILD: 1572864
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 10 -d celery@$$HOSTNAME"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Celery beat (SPEC "optional scheduled scan"; Task 9; Round 10 Task 3:
  # always-on now, no compose profile). Ticks the single unconditional
  # dispatcher `app.tasks.scheduler.dispatch_scheduled` (Round 10 Task 2)
  # every 15s; each tick re-reads the DB-backed Settings fresh and fires
  # scan/collection-sync/watched-folder work only for whichever feature has
  # its own interval set to a positive number of seconds in the Settings UI
  # -- with everything off, beat just ticks an empty dispatch and idles.
  # Reuses the api/worker image + entrypoint: the entrypoint's explicit-
  # command passthrough (see docker/entrypoint.sh) execs this directly
  # instead of routing on ROLE, so no migrations/uvicorn/worker startup
  # happen here.
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment:
      # Round 8: `dispatch_scheduled` (ticking in THIS container) checks
      # `settings.watch_dir` before ever dispatching the watched-folder scan
      # -- without it set here the watch feature is silently dead, no matter
      # what worker-io sees or what the Settings UI's watch interval says.
      # Must match worker-io.
      WATCH_DIR: /watch
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # printerd (M4; Round 10 Task 3: always-on now, no compose profile). The
  # long-lived Bambu MQTT supervisor (SPEC "Architecture") always starts and
  # runs its reconcile loop; it reads the printer flag live off the DB-backed
  # Settings every tick (`app.printerd.PrinterDaemon.enabled_printers`) and
  # idles harmlessly (zero workers) with it off, picking every enabled
  # printer up the moment the Settings UI flips it on -- no restart. Mirrors
  # `beat`: shares the app image + the entrypoint's explicit-command
  # passthrough (no ROLE routing, no migrations/uvicorn), inherits PUID/PGID.
  # Mounts /data for the Fernet key ({data_dir}/secrets/printer.key) it needs
  # to decrypt access codes. No /library mount -- FTPS upload runs in
  # worker-io.
  printerd:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    command: ["python", "-m", "app.printerd"]
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Q11 virtual printer: a fake LAN Bambu printer (SSDP UDP 2021, MQTT/TLS
  # 8883, FTPS 990) that turns a slicer "print" into a queue entry. Opt-in
  # (`docker compose --profile virtual-printer up -d`, or add it to
  # COMPOSE_PROFILES) and host-networked so slicers on the LAN can discover
  # it: with `network_mode: host` the service cannot resolve `db`/`redis` by
  # name, so DATABASE_URL/REDIS_URL in `.env` must be reachable from the
  # host (e.g. localhost + published ports, or the LAN address). It checks
  # the three ports are free at start and exits non-zero otherwise. Also set
  # TDMM_VP_ENABLED=true in `.env` to show the Settings card. Tunables:
  # TDMM_VP_BIND, TDMM_VP_PORT_{SSDP,MQTT,FTP}, TDMM_VP_PASV_{MIN,MAX,ADDRESS}.
  virtual-printer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    profiles: ["virtual-printer"]
    network_mode: host
    command: ["python", "-m", "app.virtual_printer"]
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Must match the credentials embedded in DATABASE_URL in .env.
      POSTGRES_USER: tdmm
      POSTGRES_PASSWORD: tdmm
      POSTGRES_DB: tdmm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdmm -d tdmm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # `depends_on` only gates the initial `up` ordering, not what happens
    # after a host reboot: without an explicit restart policy, `db`/`redis`
    # don't come back on their own, but `api`/`worker` do (they have
    # `restart: unless-stopped`) and then crash-loop against a Postgres/Redis
    # that's simply never there.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  tdmm_data:
