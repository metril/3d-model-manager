[project]
name = "tdmm"
# Deliberately NOT tracked by release-please (it is absent from `extra-files`
# in release-please-config.json). backend/uv.lock records this same version
# for the virtual root project (uv.lock line ~2342), so rewriting one without
# regenerating the other risks the Dockerfile's `uv sync --frozen`. This
# distribution version is inert -- the version users actually see comes from
# APP_VERSION (app.config.Settings.app_version, GET /api/health).
version = "0.1.0"
description = "3D Model Manager backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "celery",
    "blake3",
    "argon2-cffi",
    "python-slugify",
    "anyio",
    "psycopg[binary]",
    "trimesh[easy]",
    "lib3mf",
    "cascadio",
    "cadquery-ocp",
    "f3d",
    "pillow",
    "numpy",
    "smbprotocol>=1.16.1",
    "boto3",
    "bambulabs-api",
    # Already pinned 2.1.0 transitively via bambulabs-api -- promoted to a
    # direct dependency (Round 8 T1) because app.printers.probe now drives
    # it directly (a raw MQTT session for the staged Developer-Mode probe),
    # independent of the bambulabs_api client.
    "paho-mqtt",
    "cryptography",
    "httpx",
    "zipstream-ng>=1.9.3",
    "authlib>=1.9.1",
    "joserfc>=1.7.7",
    # P6 Task 4: `POST /api/profiles/import`'s multipart `bundle` upload is
    # the app's first use of FastAPI/Starlette form parsing -- needs this
    # even though no `UploadFile` param exists anywhere else yet.
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx>=0.23.1",
    "ruff",
    "testcontainers[postgres,redis,minio]",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom is `param: X = Depends(...)` -- B008 otherwise flags
# every dependency-injected endpoint parameter as a mutable-default footgun,
# which it isn't here (FastAPI calls it fresh, it's not evaluated once).
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# One event loop for the whole session so the session-scoped Postgres
# testcontainer engine/pool (see tests/conftest.py) isn't torn down and
# reused across mismatched loops between test functions.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "e2e: end-to-end tests against a live docker compose stack (see scripts/e2e.sh); excluded from the default run by the -m in addopts below",
    "live_importer: live-network importer smoke tests (real Thingiverse/Printables); excluded from the default gate by the -m in addopts",
    "perf: wall-clock performance harnesses (test_gallery_perf.py's 1.0s endpoint budget, test_scanner.py's 50k-file 30s budget); still in the default local run, but excluded in CI where shared-runner jitter makes the budgets meaningless -- see .github/workflows/ci.yml",
]
# `-m 'not e2e and not live_importer'` keeps `uv run pytest` (the unit-suite
# gate) off the network entirely: `not e2e` skips the live-docker-compose
# suite (see scripts/e2e.sh) and `not live_importer` skips the real-
# Thingiverse/Printables smokes (tests/test_thingiverse_importer.py,
# tests/test_printables_importer.py). `-m` is a single-value pytest option,
# so scripts/e2e.sh's own explicit `-m e2e` on the command line overrides
# this rather than combining with it -- the live-stack e2e run picks up
# `e2e` but stays off `live_importer` too, since it never sets that marker.
addopts = "-m 'not e2e and not live_importer'"
filterwarnings = [
    # testcontainers' own redis module trips this library-internal
    # deprecation at import time (Task 6 adds the Redis container) --
    # nothing we can fix from here, and the M1 gates require pristine
    # pytest output.
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
    # The vendored bambulabs_api mqtt client builds its SSLContext with the
    # deprecated ssl.PROTOCOL_TLS (paho/mqtt/client.py) -- nothing we can fix
    # from here, and the gates require pristine pytest output (M6 C2).
    "ignore:ssl.PROTOCOL_TLS is deprecated:DeprecationWarning",
]
